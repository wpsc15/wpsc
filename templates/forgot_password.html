<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Forgot password - WebPanel</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #030712; color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 420px); padding: 28px; border: 1px solid #1f2937; border-radius: 14px; background: #111827; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { color: #9ca3af; font-size: 14px; line-height: 1.6; }
        label { display: block; margin: 20px 0 7px; color: #d1d5db; font-size: 13px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #374151; border-radius: 7px; background: #1f2937; color: #f9fafb; font: inherit; }
        button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 7px; background: #2563eb; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        .notice { padding: 10px 12px; border: 1px solid #16a34a; border-radius: 7px; color: #86efac; font-size: 13px; }
        .error { margin: 14px 0; padding: 10px 12px; border: 1px solid #dc2626; border-radius: 7px; color: #fca5a5; font-size: 13px; }
        a { display: block; margin-top: 18px; color: #93c5fd; text-align: center; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <h1>Reset your password</h1>
        <p>Enter the recovery email address on your account. If it matches, we will email a one-time reset link.</p>
        {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/forgot-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="email">Recovery email</label>
            <input id="email" type="email" name="email" maxlength="254" autocomplete="email" required>
            <button type="submit">Send reset link</button>
        </form>
        <a href="/login">Back to sign in</a>
    </main>
</body>
</html>
