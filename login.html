<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WebPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .input-field {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #f9fafb;
            padding: 10px 12px 10px 40px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-field:focus { border-color: #3b82f6; }
        .input-field::placeholder { color: #6b7280; }
    </style>
</head>
<body style="background:#030712;min-height:100vh;display:flex;align-items:center;justify-content:center">

    <!-- Background gradient blobs -->
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0">
        <div style="position:absolute;top:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(59,130,246,0.08),transparent 70%);border-radius:50%"></div>
        <div style="position:absolute;bottom:-20%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,0.08),transparent 70%);border-radius:50%"></div>
    </div>

    <!-- Login Card -->
    <div style="position:relative;z-index:1;width:100%;max-width:400px;padding:20px">
        <!-- Logo area -->
        <div style="text-align:center;margin-bottom:32px">
            <div style="width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <i class="fas fa-server" style="color:white;font-size:28px"></i>
            </div>
            <h1 style="font-size:28px;font-weight:700;color:#f9fafb;margin-bottom:6px">WebPanel</h1>
            <p style="color:#6b7280;font-size:14px">Server Control Panel</p>
        </div>

        <!-- Card -->
        <div style="background:#111827;border:1px solid #1f2937;border-radius:16px;padding:32px">
            <h2 style="font-size:18px;font-weight:600;color:#f9fafb;margin-bottom:6px">Welcome back</h2>
            <p style="color:#6b7280;font-size:13px;margin-bottom:24px">Sign in to manage your server</p>

            <!-- Error message -->
            {% if error %}
            <div style="background:#450a0a;border:1px solid #dc2626;color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:8px">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            {% if notice %}
            <div style="background:#052e16;border:1px solid #16a34a;color:#86efac;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px">
                {{ notice }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" action="/login">
                <!-- Username -->
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:13px;font-weight:500;color:#d1d5db;margin-bottom:6px">
                        Username
                    </label>
                    <div style="position:relative">
                        <i class="fas fa-user" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#4b5563;font-size:13px"></i>
                        <input
                            type="text"
                            name="username"
                            class="input-field"
                            placeholder="admin"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- Password -->
                <div style="margin-bottom:24px">
                    <label style="display:block;font-size:13px;font-weight:500;color:#d1d5db;margin-bottom:6px">
                        Password
                    </label>
                    <div style="position:relative">
                        <i class="fas fa-lock" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#4b5563;font-size:13px"></i>
                        <input
                            type="password"
                            name="password"
                            class="input-field"
                            placeholder="••••••••"
                            required
                        >
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                    style="width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:8px"
                    onmouseover="this.style.opacity='0.9'"
                    onmouseout="this.style.opacity='1'">
                    <i class="fas fa-right-to-bracket"></i>
                    Sign In
                </button>
            </form>
            <p style="text-align:right;margin-top:16px">
                <a href="/forgot-password" style="color:#93c5fd;font-size:13px;text-decoration:none">Forgot password?</a>
            </p>
        </div>

        <!-- Footer note -->
        <p style="text-align:center;color:#374151;font-size:12px;margin-top:20px">
            WebPanel v1.0.0 &mdash; Linux Server Control Panel
        </p>
    </div>
</body>
</html>
